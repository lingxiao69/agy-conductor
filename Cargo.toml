[package]
name = "agy-conductor"
version = "0.1.0"
edition = "2021"
authors = ["lingxiao69 <62371891+lingxiao69@users.noreply.github.com>"]
description = "轻舟 AgyConductor — 轻量级原生多模型自动研发协同台 (Multi-Agent Orchestrator for Antigravity & AI CLIs)"
license = "MIT"
repository = "https://github.com/lingxiao69/agy-conductor"
homepage = "https://github.com/lingxiao69/agy-conductor"
readme = "README.md"
keywords = ["antigravity", "ai-agent", "multi-agent", "orchestrator", "webview"]
categories = ["development-tools", "gui", "command-line-utilities"]

[lib]
name = "agy_conductor"
path = "src/lib.rs"

[[bin]]
name = "agy-conductor"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "fs", "macros"] }
uuid = { version = "1", features = ["v4"] }
wry = "0.55"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
